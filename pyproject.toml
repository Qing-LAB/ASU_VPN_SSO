# Packaging for the PyPI delivery channel. The wheel is a thin wrapper: it
# carries the repository's programs plus install.sh as a payload, and one
# console script (asuvpn-install) that runs that installer — see
# asuvpn_dist/install.py for why it is deliberately nothing more.
#
# ruff's configuration stays in ruff.toml (which outranks pyproject.toml in
# ruff's discovery order), so this file holds packaging only.

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "asuvpn"
dynamic = ["version"]
description = "GNOME tray applet and CLI for ASU's SSL VPN: openconnect with SSO, a tunnel watchdog, and split DNS that stays put"
readme = "README.md"
# An SPDX expression plus the file (PEP 639). The older `{ file = "LICENSE" }`
# form pasted the entire licence text into the metadata's one-line licence
# field, which is what PyPI then showed. Needs hatchling 1.27 or newer.
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Quan Qing" }]
keywords = ["vpn", "openconnect", "anyconnect", "asu", "gnome", "tray",
            "split-dns", "systemd-resolved", "saml", "duo"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: GTK",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Networking",
]

[project.urls]
Homepage = "https://github.com/Qing-LAB/ASU_VPN_SSO"
Documentation = "https://github.com/Qing-LAB/ASU_VPN_SSO#readme"
Issues = "https://github.com/Qing-LAB/ASU_VPN_SSO/issues"
Security = "https://github.com/Qing-LAB/ASU_VPN_SSO/blob/main/SECURITY.md"

# Two, because the install has two halves and only one of them is a wheel's to
# do. See asuvpn_dist/install.py; both run a script from the payload, and every
# script named here has to be force-included below or the entry point is a
# stub that fails at the first run.
[project.scripts]
asuvpn-install = "asuvpn_dist.install:main"
asuvpn-bootstrap = "asuvpn_dist.install:bootstrap"

# The version is stated once, in the contract, where every program can read
# it; the build reads the same line, so the wheel cannot drift from what
# `asuvpn --version` prints.
[tool.hatch.version]
path = "asuvpn_contract.py"
pattern = 'VERSION = "(?P<version>[^"]+)"'


[tool.hatch.build.targets.wheel]
packages = ["asuvpn_dist"]

# The payload: the repository's own files, byte for byte. install.sh copies
# from beside itself, so they have to land beside it inside the package.
[tool.hatch.build.targets.wheel.force-include]
"asuvpn-tray" = "asuvpn_dist/payload/asuvpn-tray"
"asuvpn-helper" = "asuvpn_dist/payload/asuvpn-helper"
"asuvpn-notify" = "asuvpn_dist/payload/asuvpn-notify"
"asuvpn-selftest" = "asuvpn_dist/payload/asuvpn-selftest"
"asuvpn_contract.py" = "asuvpn_dist/payload/asuvpn_contract.py"
"install.sh" = "asuvpn_dist/payload/install.sh"
"bootstrap.sh" = "asuvpn_dist/payload/bootstrap.sh"
"asuvpn.svg" = "asuvpn_dist/payload/asuvpn.svg"

[tool.hatch.build.targets.sdist]
# Every pattern anchored with a leading "/". Hatchling matches these with
# gitignore semantics, where a pattern containing no slash matches at *any*
# depth -- so "README.md" also took tests/sandbox/README.md, and the bare
# program names also took tests/sandbox/app/*, the gitignored copies the
# scenario sandbox stages. An sdist built on a machine that had run the
# scenarios carried stale duplicates of all four programs. The release
# workflow checks out clean, so nothing shipped, but the config was one
# similarly named file away from it.
include = [
    "/asuvpn-tray", "/asuvpn-helper", "/asuvpn-notify", "/asuvpn-selftest",
    "/asuvpn_contract.py", "/install.sh", "/bootstrap.sh", "/asuvpn.svg",
    "/asuvpn_dist", "/README.md", "/DESIGN.md", "/SECURITY.md",
    "/IMPLEMENTATION_GUIDE.md",
    "/LICENSE",
    "/ruff.toml",
]
