# ASU VPN settings.
#
# Every setting is listed with its default. Change a value and the
# applet picks it up the next time it needs it -- the watchdog reads
# these on each check, so most take effect without a reconnect.
#
# Written by install.sh. Contract version 2.

# The VPN endpoint. Set by install.sh --server.
server = sslvpn.asu.edu

# Sign in again by itself when a stalled tunnel cannot be recovered for
# free. On by default: it is the last rung of the ladder, so it is reached
# only after the free re-establish has been tried and demonstrably did not
# work. Costs a Duo push and a password each time it fires -- turn it off
# to be asked first.
autoreconnect = on

# Seconds between dead-peer probes, forced on because some servers
# negotiate detection off and then a dropped tunnel looks connected. 0
# leaves the server's choice alone.
dpd = 30

# Hand the resolver the VPN pushes to systemd-resolved as per-link DNS,
# with the tunnel's domains routed to it and everything else left on the
# resolver this machine already had. This is what makes a split tunnel
# resolve internal names without sending every lookup on the machine to
# the VPN. Turn it off to leave DNS to the stock vpnc-script, which on a
# machine without nss-resolve rewrites /etc/resolv.conf -- and loses the
# change again the next time systemd-resolved rewrites its own file.
# Ignored where systemd-resolved is not running; there is nothing to hand
# it.
dns = on

# Domains to resolve through the tunnel, space or comma separated, when
# the gateway names none itself. Empty means derive one from the server
# address -- vpn.example.com gives example.com -- which right wherever the
# endpoint lives in the domain it serves. What the gateway does push
# always wins over both.
dns-domains = 

# Seconds between checks of the tunnel device and its routes. 0 turns the
# watchdog off; this file is still re-read at the default cadence, so
# turning it back on needs no restart.
health-interval = 20

# Consecutive bad checks before the badge stops claiming Connected. Two,
# because routes are briefly absent during a real reconnect. 0 behaves as
# 1.
health-strikes = 2

# Ask the network whether the tunnel still carries traffic. This is the
# only check that catches a tunnel whose device and routes are perfectly
# healthy but which delivers nothing.
probe = on

# Address to probe. Empty means whatever resolver the VPN itself pushed,
# which is the right answer on every network it is used on.
probe-target = 

# Port for the probe, 1-65535. Nothing is sent; a refusal counts as alive,
# because a RST proves a packet crossed in each direction. 0 is refused:
# it is not a connectable port, so every probe would silently come back
# inconclusive and the watchdog's probe half would be blind while claiming
# to watch.
probe-port = 53

# Run the probe on every Nth health check, so it costs a packet a minute
# rather than one every twenty seconds. 0 behaves as 1, probing on every
# check.
probe-every = 3

# Seconds to wait for an answer. A healthy tunnel replies in milliseconds,
# so this is generous by two orders of magnitude. Capped at 120: only one
# probe runs at a time, so an answer that never comes would otherwise
# block probing for as long as this.
probe-timeout = 5

# Seconds between asking openconnect to re-establish. Free, but not
# something to do every time a check fails.
nudge-min-gap = 120

# Seconds between automatic sign-ins, when autoreconnect is on. One
# budget, shared: a stalled tunnel's escalation and a dropped tunnel's
# rebuild both spend it, so neither can starve the other of the gap the
# user asked for.
autoreconnect-min-gap = 300

# Seconds each half of a connect may wait on a human before it is
# abandoned: the browser window and its Duo approval, and then the
# authorization prompt. Generous, because both are things somebody has to
# do -- but each has to end. A rebuild that runs with nobody at the
# keyboard would otherwise sit in Signing in... behind a login window, or
# in Connecting... behind a password dialog polkit will never time out,
# and only Cancel would clear it. Held to 60-3600; there is deliberately
# no off.
signin-timeout = 300

# Seconds to wait for the helper to finish. Must outlast its own signal
# escalation of 15 + 10 + 5 plus the routing check after, so values below
# 35 are refused: a shorter wait reports every clean disconnect as a
# failure while the helper is still fine.
teardown-timeout = 75

# Size the session log may reach before it is rotated, in KiB. 0 means
# never rotate on size.
log-max-kb = 4096

# Rotated logs kept beside the current one; session.log.1 is the newest.
# Connecting rotates too, so this is also how many past sessions survive.
# 0 keeps none, and rotation just truncates. Capped at 99: every rotation
# walks the whole numbered chain.
log-keep = 3
