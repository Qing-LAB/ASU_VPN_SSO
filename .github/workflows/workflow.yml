# Publishing: push a tag like v0.11.0 and this builds the sdist and wheel and
# uploads them to PyPI. No token is stored anywhere — it uses PyPI's Trusted
# Publishing, configured once on pypi.org against project "asuvpn", owner
# Qing-LAB, repository ASU_VPN_SSO, workflow **workflow.yml**, environment
# **pypi**.
#
# The filename is load-bearing. PyPI matches the publisher on the workflow's
# *file name*, not the `name:` below, so this file cannot be renamed without
# editing the publisher on pypi.org to match — the upload would be rejected as
# an invalid publisher, after a green build, with nothing said about why. It
# was called release.yml until the publisher was registered as workflow.yml.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    # Pinned, like checks.yml and scenarios.yml. `ubuntu-latest` is a label
    # that moves: GitHub repoints it at the next LTS on its own schedule, and
    # this is the one job whose run cannot be repeated — a version number is
    # spent the moment PyPI accepts it. A moving runner under an irreversible
    # step is the wrong trade even for a pure-Python wheel. When the image is
    # retired GitHub warns for months; bump it then, deliberately.
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      id-token: write   # what Trusted Publishing authenticates with
      contents: read
    steps:
      - uses: actions/checkout@v4

      # PyPI takes a version number once and never again, and nothing else in
      # this pipeline compares the tag with what is about to be built: hatch
      # reads VERSION out of asuvpn_contract.py, so a v0.9.0 tag on a tree that
      # says 0.10.0 publishes 0.10.0 and burns the wrong number, silently and
      # permanently. Cheap to check, impossible to undo.
      - name: the tag and the version must agree
        run: |
          tag="${GITHUB_REF_NAME#v}"
          # Read exactly the way hatchling reads it -- re.search with its
          # pattern, over the whole file -- and not with an anchored sed. The
          # two disagreed: a constant named "…VERSION = \"9.9.9\"" placed above
          # the real one makes hatch build 9.9.9 while sed still prints the
          # real number, so this guard would pass and the wrong version would
          # go to PyPI, permanently. Demonstrated, not theorised.
          version=$(python3 -c 'import re,sys; m=re.search(r"VERSION = \"(?P<version>[^\"]+)\"", open("asuvpn_contract.py").read()); print(m.group("version") if m else "")')
          if [ -z "$version" ]; then
            echo "no VERSION line in asuvpn_contract.py" >&2
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match VERSION ${version}." >&2
            echo "Bump the contract or retag; a wrong number cannot be" >&2
            echo "recalled once PyPI has it." >&2
            exit 1
          fi
          echo "publishing ${version} as ${GITHUB_REF_NAME}"

      - name: build the sdist and wheel
        run: pipx run build

      # The belt to the brace above: whatever the two readings agreed on, the
      # artifact about to be uploaded is the only thing that actually gets a
      # version number, so it is what the tag is finally checked against.
      - name: the artifact carries the tag's version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          if [ ! -f "dist/asuvpn-${tag}-py3-none-any.whl" ] \
             || [ ! -f "dist/asuvpn-${tag}.tar.gz" ]; then
            echo "no artifact for ${tag}; dist/ holds:" >&2
            ls -1 dist >&2
            exit 1
          fi
          echo "dist/asuvpn-${tag}-py3-none-any.whl matches ${GITHUB_REF_NAME}"

      # Force-pushing a tag re-triggers this workflow, and it happened: a
      # history rewrite moved v0.10.0 and the job ran again against a version
      # PyPI already had. It came back green because the rebuilt artifacts
      # hashed identically, which is luck rather than design — a rebuild that
      # differed by a timestamp would have failed the upload after a green
      # build, on the one job whose failure looks like a broken release.
      # skip-existing makes a re-run a deliberate no-op instead.
      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
