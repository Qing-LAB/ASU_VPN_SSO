# Publishing: push a tag like v0.9.0 and this builds the sdist and wheel and
# uploads them to PyPI. No token is stored anywhere — it uses PyPI's Trusted
# Publishing, which has to be configured once on pypi.org (project "asuvpn",
# owner Qing-LAB, repository ASU_VPN_SSO, workflow release.yml, environment
# pypi). Until that one-time step is done, this workflow fails at the upload
# with a clear message from PyPI, and nothing is published.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # what Trusted Publishing authenticates with
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: build the sdist and wheel
        run: pipx run build

      - name: publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
